<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Molten Core - WoW Forever Downgrader</title>
<style>
:root{color-scheme:dark;--ink:#efe5d0;--muted:#bcb2a0;--line:#594a36;--gold:#eac48a;--panel:#15171b}
*{box-sizing:border-box}body{margin:0;background:#101115;color:var(--ink);font:14px system-ui,sans-serif}
main{width:min(100% - 48px,810px);margin:24px auto}
header{display:flex;align-items:center;gap:18px;padding:23px 26px;border:1px solid #846640;background:radial-gradient(ellipse at 10% 10%,#523323,transparent 65%),linear-gradient(110deg,#25201b,#151b24);box-shadow:inset 0 0 0 4px #151417}
h1{font:38px Georgia,serif;color:var(--gold);margin:0 0 5px;letter-spacing:.02em}
h1 span{display:block;font-size:.52em;letter-spacing:0;margin-top:5px}
p{margin:0;color:var(--muted);line-height:1.45}select{margin-left:auto;align-self:start}
.panel{background:var(--panel);border:1px solid var(--line);padding:19px 23px;margin-top:14px}
.instructions{border-left:2px solid #d5a75e;padding-left:32px;margin:0 0 15px;color:var(--muted);line-height:1.45}
.instructions li+li{margin-top:4px}
.instructions li::marker{color:var(--gold);font-weight:700}
label{display:block;font-weight:600;margin:0 0 5px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:12px}
input,button,select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 11px;min-height:38px}
input{background:#101115;flex:1;min-width:0}button,select{background:linear-gradient(#30291f,#211e1a)}button{cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--gold)}button:disabled{opacity:.48;cursor:default}
:focus-visible{outline:2px solid #edbc72;outline-offset:2px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.primary{color:#21150c;font-weight:750;background:linear-gradient(#f2cb87,#c99b55);border-color:#c99b55}
.icon{width:20px;height:20px;vertical-align:middle;margin-right:6px;color:#e2b879}.primary .icon{color:#39250e}
.crest{width:70px;height:78px;flex:none;filter:drop-shadow(0 3px 8px #0009)}
.loghead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
#status{font:18px Georgia,serif;color:var(--gold)}
pre{margin:0;height:126px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#0f1013;border:1px solid #343037;padding:10px;color:#d2c9b9;font:12px Consolas,monospace}
progress{width:100%;height:6px;accent-color:#c99b55;display:block;margin-bottom:8px}
dialog{width:min(100% - 32px,440px);padding:22px;color:var(--ink);background:var(--panel);border:1px solid #846640;border-radius:4px;box-shadow:0 12px 36px #0009}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h2{font:24px Georgia,serif;color:var(--gold);margin:0 0 12px}
dialog p+p{margin-top:8px}
dialog .actions{justify-content:flex-end}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="folder" viewBox="0 0 24 24"><path d="M2 7h8l2 2h10l-2 11H3Z" fill="#a77333"/><path d="M2 7h8l2 2h10l-2 11H3Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 11 15 0" stroke="currentColor"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M12 2 22 6v6c0 5-10 10-10 10S2 17 2 12V6Z" fill="#334039" stroke="currentColor" stroke-width="1.5"/><path d="m7 12 3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M3 15v6h18v-6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><path d="m7 2 10 0 5 5v10l-5 5H7l-5-5V7Z" fill="#6c302c" stroke="currentColor" stroke-width="1.5"/><path d="m8 8 8 8m0-8-8 8" stroke="currentColor" stroke-width="2"/></symbol>
</svg>
<main>
<header>
<svg class="crest" viewBox="0 0 72 80" aria-hidden="true"><defs><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f7d6a1"/><stop offset=".55" stop-color="#ab7540"/><stop offset="1" stop-color="#efba77"/></linearGradient></defs><path d="M36 3 66 16 62 52Q55 67 36 77 17 67 10 52L6 16Z" fill="#251b18" stroke="url(#metal)" stroke-width="4"/><path d="M36 10 58 21 55 50Q50 62 36 69 22 62 17 50L14 21Z" fill="#342b2d" stroke="#8f643d"/><path d="m36 18 10 21-10 21-10-21Z" fill="#a95f45" stroke="#edba7f" stroke-width="2"/><path d="M36 20v38M26 39h20" stroke="#f4c98c" stroke-width="1.4"/><path d="m17 25 7 8-5 11m36-19-7 8 5 11" fill="none" stroke="#c7955d" stroke-width="2"/></svg>
<div><h1>Molten Core <span> - WoW Forever Downgrader</span></h1></div>
<select id="language" aria-label="Idioma / Language"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="ru">Русский</option></select>
</header>
<section class="panel">
<ol class="instructions"><li data-t="step1"></li><li data-t="step2"></li><li><span data-t="step3"></span> <span data-t="press"></span> <strong data-t="validate"></strong> <span data-t="then"></span> <strong data-t="install"></strong>.</li><li><span data-t="step4"></span> <code>_forever_</code> <span data-t="step4End"></span></li></ol>
<label for="source" data-t="source"></label><div class="field"><input id="source" spellcheck="false"><button id="browseSource"><svg class="icon" aria-hidden="true"><use href="#folder"/></svg><span data-t="browse"></span></button></div>
<label for="destination" data-t="destination"></label><div class="field"><input id="destination" spellcheck="false"><button id="browseDestination"><svg class="icon" aria-hidden="true"><use href="#folder"/></svg><span data-t="browse"></span></button></div>
<label for="version" data-t="version"></label><div class="field"><input id="version" placeholder="1.60.1.71037" maxlength="22" spellcheck="false"></div>
<div class="actions"><button class="primary" id="install"><svg class="icon" aria-hidden="true"><use href="#download"/></svg><span data-t="install"></span></button><button id="validate"><svg class="icon" aria-hidden="true"><use href="#check"/></svg><span data-t="validate"></span></button><button id="cancel" disabled><svg class="icon" aria-hidden="true"><use href="#stop"/></svg><span data-t="cancel"></span></button></div>
</section>
<section class="panel">
<div class="loghead"><span id="appVersion"></span><button id="exitApp" hidden data-t="exitApp"></button><button id="checkUpdate" data-t="checkUpdate"></button></div>
<div id="updateOffer" hidden><p id="updateQuestion"></p><div class="actions"><button class="primary" id="updateNow" data-t="updateNow"></button><button id="updateLater" data-t="updateLater"></button></div></div>
</section>
<section class="panel"><div class="loghead"><strong id="status" aria-live="polite"></strong><button id="copy" data-t="copy" disabled></button></div><progress id="progress" hidden></progress><pre id="log" tabindex="0" aria-label="Registro / Log"></pre></section>
</main>
<dialog id="startupNotice" aria-labelledby="startupTitle" aria-describedby="startupIntro startupPolicy">
<h2 id="startupTitle" data-t="startupTitle"></h2>
<p id="startupIntro" data-t="startupIntro"></p>
<p id="startupPolicy" data-t="startupPolicy"></p>
<form method="dialog" class="actions"><button class="primary" autofocus data-t="startupContinue"></button></form>
</dialog>
<script>
const $ = id => document.getElementById(id);
const words = {
 es:{step1:'Cierra WoW y Battle.net.',step2:'Elige tu instalación y una carpeta aparte. Escribe la versión completa que necesitas y pulsa Validar y luego Instalar.',step3:'Al terminar, selecciona la subcarpeta _forever_ de la copia en el destino.',source:'Instalación de origen',destination:'Carpeta de destino',version:'Versión de destino',browse:'Examinar',install:'Instalar',validate:'Validar',cancel:'Cancelar',copy:'Copiar registro',ready:'Listo',validating:'Validando versión…',validated:'Manifiestos disponibles',installing:'Instalando…',installed:'Instalación completada. Selecciona la carpeta _forever_ en el destino.',failed:'Error. Consulta el registro.',cancelling:'Cancelando…',cancelled:'Cancelado. Usa las mismas carpetas y versión para reanudar.',missing:'Indica el origen y el destino.',invalid:'Escribe la versión completa, por ejemplo 1.60.1.71037.'},
 en:{step1:'Close WoW and Battle.net.',step2:'Choose your installation and a separate destination. Enter the full build you need, then select Validate, then Install.',step3:'When finished, select the new copy’s _forever_ subfolder in the destination.',source:'Source installation',destination:'Destination folder',version:'Target version',browse:'Browse',install:'Install',validate:'Validate',cancel:'Cancel',copy:'Copy log',ready:'Ready',validating:'Checking version…',validated:'Manifests available',installing:'Installing…',installed:'Installation complete. Select the _forever_ folder in the destination.',failed:'See the log for details.',cancelling:'Cancelling…',cancelled:'Cancelled. Use the same folders and version to resume.',missing:'Enter both source and destination folders.',invalid:'Enter the full version, for example 1.60.1.71037.'}
};
Object.assign(words.es,{checkUpdate:'Buscar actualizaciones',updateNow:'Actualizar ahora',updateLater:'Más tarde',checkingUpdate:'Buscando actualizaciones…',downloadingUpdate:'Descargando actualización…',updateInstalled:'Actualización instalada. Cierra y vuelve a abrir Molten Core.',updateAvailable:'Actualización disponible',upToDate:'Ya tienes la última versión publicada.',updateMissingAssets:'La nueva versión todavía no tiene los archivos de actualización.',updateFailed:'No se pudo actualizar. Consulta el registro.',updateCancelled:'Actualización cancelada.',question:v=>'Está disponible '+v+'. ¿Quieres descargar e instalar la actualización ahora?'});
Object.assign(words.en,{checkUpdate:'Check for updates',updateNow:'Update now',updateLater:'Later',checkingUpdate:'Checking for updates…',downloadingUpdate:'Downloading update…',updateInstalled:'Update installed. Close and reopen Molten Core.',updateAvailable:'Update available',upToDate:'You have the latest published version.',updateMissingAssets:'The new release is missing the update files.',updateFailed:'Update failed. See the log for details.',updateCancelled:'Update cancelled.',question:v=>v+' is available. Download and install it now?'});
const localeKeys='step1 step2 step3 source destination version browse install validate cancel copy ready validating validated installing installed failed cancelling cancelled missing invalid checkUpdate updateNow updateLater checkingUpdate downloadingUpdate updateInstalled updateAvailable upToDate updateMissingAssets updateFailed updateCancelled question'.split(' ');
const extraLocales={
fr:"Fermez WoW et Battle.net.|Choisissez votre installation et un dossier distinct. Saisissez la version complète, puis validez et installez.|La copie se trouve dans le sous-dossier _forever_ de la destination.|Installation source|Dossier de destination|Version cible|Parcourir|Installer|Valider|Annuler|Copier le journal|Prêt|Validation de la version…|Manifestes disponibles|Installation…|Installation terminée. Ouvrez le sous-dossier _forever_.|Consultez le journal.|Annulation…|Annulé. Réutilisez les mêmes dossiers et la même version pour reprendre.|Indiquez les dossiers source et de destination.|Saisissez la version complète, par exemple 1.60.1.71037.|Rechercher des mises à jour|Mettre à jour|Plus tard|Recherche de mises à jour…|Téléchargement de la mise à jour…|Mise à jour installée. Fermez et rouvrez Molten Core.|Mise à jour disponible|Vous avez la dernière version publiée.|Fichiers de mise à jour manquants.|Échec de la mise à jour. Consultez le journal.|Mise à jour annulée.|La version {version} est disponible. Mettre à jour maintenant ?",
pt:"Feche o WoW e o Battle.net.|Escolha sua instalação e uma pasta separada. Digite a versão completa, valide e instale.|A cópia ficará na subpasta _forever_ do destino.|Instalação de origem|Pasta de destino|Versão de destino|Procurar|Instalar|Validar|Cancelar|Copiar registro|Pronto|Validando a versão…|Manifestos disponíveis|Instalando…|Instalação concluída. Abra a subpasta _forever_.|Consulte o registro.|Cancelando…|Cancelado. Use as mesmas pastas e versão para retomar.|Indique as pastas de origem e destino.|Digite a versão completa, por exemplo 1.60.1.71037.|Buscar atualizações|Atualizar agora|Mais tarde|Buscando atualizações…|Baixando atualização…|Atualização instalada. Feche e reabra o Molten Core.|Atualização disponível|Você tem a versão publicada mais recente.|Faltam os arquivos da atualização.|Não foi possível atualizar. Consulte o registro.|Atualização cancelada.|A versão {version} está disponível. Atualizar agora?",
de:"Schließe WoW und Battle.net.|Wähle deine Installation und einen separaten Ordner. Gib die vollständige Version ein, prüfe sie und starte die Installation.|Die Kopie liegt im Unterordner _forever_ des Zielordners.|Quellinstallation|Zielordner|Zielversion|Durchsuchen|Installieren|Prüfen|Abbrechen|Protokoll kopieren|Bereit|Version wird geprüft…|Manifeste verfügbar|Installation läuft…|Installation abgeschlossen. Öffne den Unterordner _forever_.|Details stehen im Protokoll.|Abbruch läuft…|Abgebrochen. Verwende dieselben Ordner und dieselbe Version zum Fortsetzen.|Gib Quell- und Zielordner an.|Gib die vollständige Version ein, z. B. 1.60.1.71037.|Nach Updates suchen|Jetzt aktualisieren|Später|Suche nach Updates…|Update wird heruntergeladen…|Update installiert. Schließe Molten Core und öffne es erneut.|Update verfügbar|Du hast die neueste veröffentlichte Version.|Die Update-Dateien fehlen.|Update fehlgeschlagen. Siehe Protokoll.|Update abgebrochen.|Version {version} ist verfügbar. Jetzt aktualisieren?",
ru:"Закройте WoW и Battle.net.|Выберите установленную копию и отдельную папку. Введите полный номер версии, проверьте её и начните установку.|Копия будет в подпапке _forever_ папки назначения.|Исходная установка|Папка назначения|Целевая версия|Обзор|Установить|Проверить|Отмена|Копировать журнал|Готово|Проверка версии…|Манифесты доступны|Установка…|Установка завершена. Откройте подпапку _forever_.|Подробности в журнале.|Отмена…|Отменено. Для продолжения выберите те же папки и версию.|Укажите исходную папку и папку назначения.|Введите полный номер версии, например 1.60.1.71037.|Проверить обновления|Обновить сейчас|Позже|Поиск обновлений…|Загрузка обновления…|Обновление установлено. Закройте и снова откройте Molten Core.|Доступно обновление|У вас последняя опубликованная версия.|Файлы обновления отсутствуют.|Не удалось обновить программу. См. журнал.|Обновление отменено.|Доступна версия {version}. Обновить сейчас?"
};
for(const [locale, entries] of Object.entries(extraLocales)){
 const strings=entries.split('|');
 words[locale]=Object.fromEntries(localeKeys.map((key,i)=>[key,strings[i]]));
 const question=words[locale].question;
 words[locale].question=version=>question.replace('{version}',version);
}
const usage = {
 es:['Cierra WoW y Battle.net.','Selecciona la instalación de origen y una carpeta de destino separada.','Escribe la versión completa que necesitas.','Pulsa','y luego','La copia quedará en la subcarpeta','del destino.'],
 en:['Close WoW and Battle.net.','Select the source installation and a separate destination folder.','Enter the full version you need.','Select','and then','The copy will be in the subfolder','of the destination.'],
 fr:['Fermez WoW et Battle.net.','Sélectionnez l’installation source et un dossier de destination distinct.','Saisissez la version complète souhaitée.','Cliquez sur','puis sur','La copie se trouvera dans le sous-dossier','de la destination.'],
 pt:['Feche o WoW e o Battle.net.','Selecione a instalação de origem e uma pasta de destino separada.','Digite a versão completa de que você precisa.','Clique em','e depois em','A cópia ficará na subpasta','do destino.'],
 de:['Schließe WoW und Battle.net.','Wähle die Quellinstallation und einen separaten Zielordner.','Gib die vollständige Version ein, die du benötigst.','Klicke auf','und dann auf','Die Kopie liegt im Unterordner','des Zielordners.'],
 ru:['Закройте WoW и Battle.net.','Выберите исходную установку и отдельную папку назначения.','Введите полный номер нужной версии.','Нажмите','и затем','Копия будет в подпапке','папки назначения.']
};
const usageKeys=['step1','step2','step3','press','then','step4','step4End'];
for(const [locale, steps] of Object.entries(usage)){
 for(const [i,key] of usageKeys.entries()) words[locale][key]=steps[i];
}
const exits={es:'Cerrar',en:'Exit',fr:'Quitter',pt:'Sair',de:'Beenden',ru:'Выход'};
for(const locale of Object.keys(words))words[locale].exitApp=exits[locale];
const folderErrors={
 es:'No se pudo abrir el selector. Escribe o pega la ruta en el campo.',
 en:'Could not open the folder picker. Enter or paste the path in the field.',
 fr:'Impossible d’ouvrir le sélecteur. Saisissez ou collez le chemin dans le champ.',
 pt:'Não foi possível abrir o seletor. Digite ou cole o caminho no campo.',
 de:'Der Ordnerdialog konnte nicht geöffnet werden. Gib den Pfad ein oder füge ihn ein.',
 ru:'Не удалось открыть выбор папки. Введите или вставьте путь в поле.'
};
for(const locale of Object.keys(words))words[locale].folderFailed=folderErrors[locale];
const startupCopy={
 es:['Aviso de la comunidad','Molten Core fue creado con ayuda de ChatGPT (IA) para la comunidad. Úsalo con precaución.','Si Blizzard Entertainment presenta una reclamación sobre el proyecto, se detendrá el desarrollo. Mientras tanto, Molten Core seguirá siendo de código abierto.','Entendido'],
 en:['Community notice','Molten Core was created with the help of ChatGPT (AI) for the community. Use it with caution.','If Blizzard Entertainment makes a claim regarding the project, development will stop. Until then, Molten Core will remain open source.','Got it'],
 fr:['Avis à la communauté','Molten Core a été créé pour la communauté avec l’aide de ChatGPT (IA). Utilisez-le avec prudence.','Si Blizzard Entertainment présente une réclamation concernant le projet, son développement sera arrêté. D’ici là, Molten Core restera open source.','Compris'],
 pt:['Aviso à comunidade','O Molten Core foi criado para a comunidade com a ajuda do ChatGPT (IA). Use-o com cautela.','Se a Blizzard Entertainment apresentar uma reclamação sobre o projeto, o desenvolvimento será interrompido. Até lá, o Molten Core continuará sendo de código aberto.','Entendi'],
 de:['Hinweis für die Community','Molten Core wurde mit Hilfe von ChatGPT (KI) für die Community entwickelt. Verwende es mit Vorsicht.','Wenn Blizzard Entertainment einen Anspruch in Bezug auf das Projekt geltend macht, wird die Entwicklung eingestellt. Bis dahin bleibt Molten Core Open Source.','Verstanden'],
 ru:['Уведомление для сообщества','Molten Core создан для сообщества с помощью ChatGPT (ИИ). Используйте программу с осторожностью.','Если Blizzard Entertainment предъявит претензию в отношении проекта, разработка будет прекращена. До тех пор Molten Core останется проектом с открытым исходным кодом.','Понятно']
};
const startupKeys=['startupTitle','startupIntro','startupPolicy','startupContinue'];
for(const [locale, strings] of Object.entries(startupCopy)){
 for(const [i,key] of startupKeys.entries()) words[locale][key]=strings[i];
}
let current='ready', notice='', suggested='', busy=false, picking=false, release='', dismissed=false, received=0, total=0;
const tr = key => words[$('language').value][key];
function render(){
 document.documentElement.lang=$('language').value;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));
 $('status').textContent=tr(notice||current);
 const active=['installing','validating','cancelling','checkingUpdate','downloadingUpdate'].includes(current);
 ['source','destination','version','install','validate','browseSource','browseDestination','checkUpdate','updateNow'].forEach(id=>$(id).disabled=busy||active||picking||current==='updateInstalled');
 $('updateOffer').hidden=current!=='updateAvailable'||dismissed;
 if(release)$('updateQuestion').textContent=tr('question')(release);
 $('cancel').disabled=!active||current==='cancelling';
 const bar=$('progress');
 bar.hidden=!active;
 if(total>0&&current==='downloadingUpdate'){
  bar.max=total;bar.value=received;
  $('status').textContent+=' '+Math.min(100,Math.floor(received/total*100))+'%';
 }else{bar.removeAttribute('value');}
}
async function suggest(){
 const version=$('version').value.trim(), next=await suggestDestination(version);
 if(!next||version!==$('version').value.trim())return;
 if(!$('destination').value||$('destination').value===suggested){suggested=next;$('destination').value=next;}
}
async function pick(id){
 notice='';picking=true;render();
 try{const folder=await pickFolder();if(folder)$(id).value=folder;}
 catch{notice='folderFailed';} finally{picking=false;render();if(notice==='folderFailed')$(id).focus();}
}
async function start(mode){
 const version=$('version').value.trim(),source=$('source').value.trim(),destination=$('destination').value.trim();
 if(!/^\d{1,3}\.\d{1,3}\.\d{1,3}\.[1-9]\d{0,8}$/.test(version)){notice='invalid';render();return;}
 if(mode==='install'&&(!source||!destination)){notice='missing';render();return;}
 notice='';busy=true;render();
 try{await startJob(mode,version,source,destination);await refresh();}
 catch(e){current='failed';$('log').textContent=String(e);}
 finally{busy=false;render();}
}
async function refresh(){
 const job=await readJob();
 current=job.Status;
 release=job.Release;received=job.Received;total=job.Total;
 const next=(job.Log||[]).join('\n'), log=$('log');
 if(log.textContent!==next){log.textContent=next;log.scrollTop=log.scrollHeight;}
 $('copy').disabled=!next;
 render();
}
async function update(download){
 if(busy||picking)return;
 notice='';busy=true;if(!download)dismissed=false;render();
 try{await (download?downloadUpdate():checkUpdate());await refresh();}
 catch(e){current='updateFailed';$('log').textContent=String(e);}
 finally{busy=false;render();}
}
$('checkUpdate').onclick=()=>update(false);
$('updateNow').onclick=()=>update(true);
$('updateLater').onclick=()=>{dismissed=true;render();};
$('language').onchange=render;
$('version').oninput=()=>{notice='';suggest();};
$('browseSource').onclick=()=>pick('source');
$('browseDestination').onclick=()=>pick('destination');
$('install').onclick=()=>start('install');
$('validate').onclick=()=>start('validate');
$('cancel').onclick=async()=>{await cancelJob();await refresh();};
$('copy').onclick=()=>{const range=document.createRange();range.selectNodeContents($('log'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);document.execCommand('copy');selection.removeAllRanges();};
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e=>e.preventDefault());
render();
$('startupNotice').showModal();
if(typeof closeApp==='function'){checkUpdate.hidden=true;exitApp.hidden=false;exitApp.onclick=async()=>{await closeApp();document.body.textContent=tr('exitApp');};}
if(typeof readJob==='function'){suggest();getAppVersion().then(v=>$('appVersion').textContent=v);setInterval(()=>refresh().catch(()=>{}),450);if(typeof checkUpdate==='function')update(false);}
</script>
</body>
</html>
